name: Sanitize Makarov runtime mesh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sanitize-makarov.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mesh conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "trimesh>=4.4,<5" "numpy>=1.26,<3"

      - name: Flatten Makarov to geometry-only OBJ
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import trimesh

          source = Path('assets/weapons/cc0/makarov.glb')
          destination = Path('assets/weapons/runtime/makarov.obj')
          destination.parent.mkdir(parents=True, exist_ok=True)

          loaded = trimesh.load(source, force='scene', process=False)
          scene = loaded if isinstance(loaded, trimesh.Scene) else trimesh.Scene(loaded)

          meshes = []
          for node_name in scene.graph.nodes_geometry:
              transform, geometry_name = scene.graph.get(node_name)
              geometry = scene.geometry[geometry_name]
              vertices = np.asarray(geometry.vertices, dtype=np.float64)
              faces = np.asarray(geometry.faces, dtype=np.int64)
              clean = trimesh.Trimesh(vertices=vertices, faces=faces, process=False)
              clean.apply_transform(transform)
              meshes.append(clean)

          if not meshes:
              raise RuntimeError('No mesh geometry found in Makarov GLB')

          combined = trimesh.util.concatenate(meshes)
          combined.remove_unreferenced_vertices()
          combined.merge_vertices()

          # Write a deliberately minimal OBJ ourselves so no texture, material,
          # color, animation or glTF metadata can reach Godot's importer.
          with destination.open('w', encoding='utf-8', newline='\n') as output:
              output.write('# Sanitized geometry-only Makarov runtime mesh\n')
              for vertex in combined.vertices:
                  output.write(f'v {vertex[0]:.8f} {vertex[1]:.8f} {vertex[2]:.8f}\n')
              for normal in combined.vertex_normals:
                  output.write(f'vn {normal[0]:.8f} {normal[1]:.8f} {normal[2]:.8f}\n')
              for face in combined.faces:
                  a, b, c = (int(index) + 1 for index in face)
                  output.write(f'f {a}//{a} {b}//{b} {c}//{c}\n')

          print(f'Exported {destination}')
          print(f'Vertices: {len(combined.vertices)}')
          print(f'Faces: {len(combined.faces)}')
          print(f'Bytes: {destination.stat().st_size}')
          PY

      - name: Commit sanitized mesh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weapons/runtime/makarov.obj
          if git diff --cached --quiet; then
            echo "Sanitized Makarov mesh already current."
            exit 0
          fi
          git commit -m "Add sanitized Makarov runtime OBJ"
          git push origin HEAD:main
