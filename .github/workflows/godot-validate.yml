name: Validate Godot project

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - ".github/workflows/godot-validate.yml"
  pull_request:
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - ".github/workflows/godot-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Parse project headlessly
        shell: bash
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit
