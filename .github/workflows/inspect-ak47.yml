name: Inspect AK47 scene

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-ak47.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trimesh
        run: python -m pip install "trimesh>=4.4,<5" "numpy>=1.26,<3"
      - name: Inspect GLB nodes
        run: |
          python - <<'PY'
          import trimesh
          scene = trimesh.load('assets/weapons/cc0/ak47.glb', force='scene', process=False)
          print('GRAPH NODES:')
          for node_name in scene.graph.nodes_geometry:
              transform, geometry_name = scene.graph.get(node_name)
              geo = scene.geometry[geometry_name].copy()
              geo.apply_transform(transform)
              b = geo.bounds
              c = geo.centroid
              ext = b[1] - b[0]
              print(f'NODE {node_name!r} geometry={geometry_name!r} center={c.tolist()} extents={ext.tolist()} min={b[0].tolist()} max={b[1].tolist()}')
          PY
